<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech System - Início</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #0b1b3a;
            --text: #1e293b;
            --muted: #5b6b82;
            --line: #dce1e9;
            --paper: #f4f6f9;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eaf0fe;
            --danger: #dc2626;
            --font: "Manrope", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            color: var(--text);
            background: #fff;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        :focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.45);
            outline-offset: 2px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.02em;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }

        body {
            background: var(--paper);
            min-height: 100vh;
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--line);
            padding: 0 32px;
            height: 68px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: var(--ink);
        }

        .topo-direita {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .usuario {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
        }

        .usuario[hidden] {
            display: none;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--primary-soft);
            color: var(--primary-dark);
            font-weight: 800;
        }

        .logout {
            height: 40px;
            padding: 0 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .logout:hover {
            background: var(--paper);
            border-color: #b9c3d2;
        }

        main {
            max-width: 1080px;
            margin: 40px auto 56px;
            padding: 0 24px;
        }

        .welcome {
            background-color: var(--ink);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 48px 48px;
            color: #fff;
            padding: 48px 44px;
            border-radius: 14px;
        }

        .welcome h2 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #c7d2e6;
            font-size: 18px;
        }

        .areas-titulo {
            margin: 40px 0 16px;
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
        }

        .areas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
        }

        .card {
            padding: 28px;
        }

        .card + .card {
            border-left: 1px solid var(--line);
        }

        .icone {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            margin-bottom: 18px;
            border-radius: 10px;
            background: var(--primary-soft);
            color: var(--primary-dark);
        }

        .icone svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .card p {
            color: var(--muted);
        }

        @media (max-width: 760px) {
            header {
                padding: 0 20px;
            }

            .usuario span:last-child {
                display: none;
            }

            .welcome {
                padding: 36px 26px;
            }

            .areas {
                grid-template-columns: 1fr;
            }

            .card + .card {
                border-left: none;
                border-top: 1px solid var(--line);
            }
        }
    </style>
</head>

<body>

    <header>
        <h1 class="logo">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2563eb"/><path d="M9 11h14M16 11v11" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
            Tech System
        </h1>

        <div class="topo-direita">
            <div class="usuario" id="usuarioLogado" hidden>
                <span class="avatar" id="avatar" aria-hidden="true"></span>
                <span id="nomeUsuario"></span>
            </div>

            <button class="logout" onclick="sair()">
                Sair
            </button>
        </div>
    </header>

    <main>

        <section class="welcome">
            <h2>Bem-vindo ao Tech System!</h2>

            <p>
                Você entrou no sistema com sucesso.
            </p>
        </section>

        <h2 class="areas-titulo">Áreas do sistema</h2>

        <section class="areas">

            <div class="card">
                <div class="icone">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </div>
                <h3>Dashboard</h3>
                <p>
                    Área principal do sistema.
                </p>
            </div>

            <div class="card">
                <div class="icone">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <h3>Usuários</h3>
                <p>
                    Gerencie os usuários do sistema.
                </p>
            </div>

            <div class="card">
                <div class="icone">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                </div>
                <h3>Configurações</h3>
                <p>
                    Configure as opções do sistema.
                </p>
            </div>

        </section>

    </main>

    <script>
        function sair() {
            window.location.href = "login.html";
        }
    </script>

    <script>
        // Mostra o usuário cadastrado no canto superior
        try {
            const usuario = localStorage.getItem("usuarioCadastrado");

            if (usuario) {
                document.getElementById("nomeUsuario").textContent = usuario;
                document.getElementById("avatar").textContent = usuario.charAt(0).toUpperCase();
                document.getElementById("usuarioLogado").hidden = false;
            }
        } catch (e) {}
    </script>

</body>
</html>
